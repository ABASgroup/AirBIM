services:
  database:
    container_name: airbim-database
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    container_name: airbim-cache
    image: redis:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${CACHE_PASSWORD} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$CACHE_PASSWORD", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    container_name: airbim-broker
    image: redis:latest
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${BROKER_PASSWORD} --appendonly yes
    ports:
      - "${BROKER_PORT:-6380}:6380"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$BROKER_PASSWORD", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    container_name: airbim-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: database
      DB_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy

volumes:
  database_data:
  redis-data:
