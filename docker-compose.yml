services:
  storage:
    container_name: airbim-storage
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      - MINIO_ENDPOINT=${STORAGE_ENDPOINT}
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY}
      - MINIO_BUCKET=${STORAGE_BUCKET}
    command: server /data --console-address ":9001"
    ports:
      - "${STORAGE_PORT}:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${STORAGE_PORT}/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  database:
    container_name: airbim-database
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      storage:
        condition: service_healthy

  cache:
    container_name: airbim-cache
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${CACHE_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${CACHE_PORT:-6379}:6379"
    volumes:
      - cache_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$CACHE_PASSWORD", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      database:
        condition: service_healthy

  broker:
    container_name: airbim-broker
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${BROKER_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${BROKER_PORT:-6380}:6379"
    volumes:
      - broker_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$BROKER_PASSWORD", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      cache:
        condition: service_healthy

  worker:
    container_name: airbim-worker
    command: ["celery", "-A", "infrastructure.celery:celery_app", "worker", "-l", "info", "-Q", "default", "--concurrency=4"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${BROKER_PASSWORD}@broker:6379/0
      - CELERY_RESULT_BACKEND=redis://:${BROKER_PASSWORD}@broker:6379/0
    depends_on:
      broker:
        condition: service_healthy
      database:
        condition: service_healthy

  worker-converter:
    container_name: airbim-worker-converter
    command: ["celery", "-A", "infrastructure.celery:celery_app", "worker", "-l", "info", "-Q", "converter", "--concurrency=8"]
    build:
      context: ./backend
      dockerfile: Dockerfile.converter
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${BROKER_PASSWORD}@broker:6379/0
      - CELERY_RESULT_BACKEND=redis://:${BROKER_PASSWORD}@broker:6379/0
    depends_on:
      broker:
        condition: service_healthy
      database:
        condition: service_healthy

  worker-heavy:
    container_name: airbim-worker-heavy
    command: ["celery", "-A", "infrastructure.celery:celery_app", "worker", "-l", "info", "-Q", "heavy", "--concurrency=8"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${BROKER_PASSWORD}@broker:6379/0
      - CELERY_RESULT_BACKEND=redis://:${BROKER_PASSWORD}@broker:6379/0
    depends_on:
      broker:
        condition: service_healthy
      database:
        condition: service_healthy
  
  beat:
    container_name: airbim-beat
    command: ["celery", "-A", "infrastructure.celery:celery_app", "beat", "-l", "info"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${BROKER_PASSWORD}@broker:6379/0
      - CELERY_RESULT_BACKEND=redis://:${BROKER_PASSWORD}@broker:6379/0
    depends_on:
      broker:
        condition: service_healthy
      database:
        condition: service_healthy

  flower:
    container_name: airbim-flower
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "infrastructure.celery:celery_app", "flower"]
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://:${BROKER_PASSWORD}@broker:6379/0
      - CELERY_RESULT_BACKEND=redis://:${BROKER_PASSWORD}@broker:6379/0
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      broker:
        condition: service_healthy
      database:
        condition: service_healthy

  backend:
    container_name: airbim-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: database
      DB_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      storage:
        condition: service_healthy
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      broker:
        condition: service_healthy

volumes:
  database_data:
  storage_data:
  cache_data:
  broker_data:
